name: Pilot release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installers as a private prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pilot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:mobile
      - run: npm run mobile:build
      - run: npm run server:test
      - run: npm run server:typecheck
      - name: Build Electron before end-to-end tests
        run: npm run package
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - name: Run Electron end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Reject tracked private keys
        shell: bash
        run: |
          if git grep -IEn -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- .; then
            echo 'A private key is tracked. Publication is blocked.' >&2
            exit 1
          fi
      - run: git diff --check

  windows-installer:
    needs: source-gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run make:windows
      - name: Collect exactly one installer
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -Path out/make -Recurse -Filter '*Setup.exe')
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($setups.Count)."
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $setups[0].FullName release/CH-Ultimate-0.1.1-Setup.exe
          Get-FileHash -Algorithm SHA256 release/CH-Ultimate-0.1.1-Setup.exe

  android-apk:
    needs: source-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm run android:sync
      - run: npm run android:test
      - run: npm run android:lint
      - name: Build pilot debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Collect exactly one APK
        shell: bash
        run: |
          mapfile -t apks < <(find android/app/build/outputs/apk/debug -type f -name '*-debug.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK, found ${#apks[@]}." >&2
            exit 1
          fi
          mkdir -p release
          cp "${apks[0]}" release/CHU-Companion-Mobile-0.1.1-pilot-debug.apk
          sha256sum release/CHU-Companion-Mobile-0.1.1-pilot-debug.apk

  publish-prerelease:
    needs: [windows-installer, android-apk]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Rebuild Windows release payload
        run: npm run make:windows
      - run: npm run android:sync
      - name: Rebuild Android release payload
        working-directory: android
        shell: pwsh
        run: .\gradlew.bat assembleDebug
      - name: Collect exact release payload and create checksums
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -Path out/make -Recurse -Filter '*Setup.exe')
          $apks = @(Get-ChildItem -Path android/app/build/outputs/apk/debug -Recurse -Filter '*-debug.apk')
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Setup.exe, found $($setups.Count)."
          }
          if ($apks.Count -ne 1) {
            throw "Expected exactly one debug APK, found $($apks.Count)."
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $setups[0].FullName release/CH-Ultimate-0.1.1-Setup.exe
          Copy-Item $apks[0].FullName release/CHU-Companion-Mobile-0.1.1-pilot-debug.apk
          $names = @(
            'CH-Ultimate-0.1.1-Setup.exe',
            'CHU-Companion-Mobile-0.1.1-pilot-debug.apk'
          )
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path release $name)).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksumPath = Join-Path (Resolve-Path release) 'SHA256SUMS.txt'
          $portableManifest = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText($checksumPath, $portableManifest, [System.Text.Encoding]::ASCII)
      - name: Publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create pilot-v0.1.1 `
            release/CH-Ultimate-0.1.1-Setup.exe `
            release/CHU-Companion-Mobile-0.1.1-pilot-debug.apk `
            release/SHA256SUMS.txt `
            --prerelease `
            --target "$env:GITHUB_SHA" `
            --title 'CH Ultimate pilot v0.1.1' `
            --notes-file docs/releases/pilot-0.1.1.md
