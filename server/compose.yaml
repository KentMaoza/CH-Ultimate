services:
  ch-core:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      CH_CORE_HOST: "127.0.0.1"
      CH_CORE_PORT: "18080"
      CH_CORE_DB_POOL_MAX: "4"
      CH_CORE_PRIVATE_STORAGE_ROOT: /var/lib/ch-core/private
    restart: unless-stopped
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    volumes:
      - type: bind
        source: ${CH_CORE_PRIVATE_STORAGE_HOST_PATH:?set CH_CORE_PRIVATE_STORAGE_HOST_PATH}
        target: /var/lib/ch-core/private
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
